<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a08"><title>Serviços — Império Barbearia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a08;color:#f4f7f2;font-family:Arial,sans-serif}
header{padding:18px;background:#111611;border-bottom:1px solid #293629;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1,h2{color:#b7f34a}h1{font-size:21px;margin:0}h2{font-size:19px;margin:0 0 15px}
main{max-width:900px;margin:auto;padding:20px 16px 50px}.back,.primary,button{display:inline-block;padding:12px 15px;border:0;border-radius:10px;background:#b7f34a;color:#101510;text-decoration:none;font-weight:bold;cursor:pointer}
.secondary{background:#20291d;color:#eaf2e5;border:1px solid #40523a}.danger{background:#392020;color:#ffdada}
.panel,.service{margin-top:18px;padding:18px;border:1px solid #34452f;border-radius:14px;background:#111611}
label{display:block;color:#cbd5c5;font-size:13px;margin:13px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #40523a;border-radius:9px;background:#090d09;color:#fff;font:inherit}textarea{min-height:75px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.check{display:flex;align-items:center;gap:9px;padding:10px;background:#0b100b;border:1px solid #293629;border-radius:9px;color:#e4ecdf;font-size:13px}.check input{width:auto}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
#status{color:#b8c2b3;line-height:1.5;margin:12px 0}.service{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.service img{width:82px;height:82px;object-fit:cover;border-radius:10px;background:#20291d}.serviceInfo{flex:1;min-width:180px}.service strong{color:#b7f34a}.muted{color:#aab5a5;font-size:13px;line-height:1.6}.pill{display:inline-block;margin:5px 5px 0 0;padding:5px 8px;border-radius:20px;background:#20291d;color:#cfe6b7;font-size:11px}
.hidden{display:none!important}.empty{padding:18px;color:#aab5a5;text-align:center;border:1px dashed #40523a;border-radius:10px}
</style></head>
<body>
<header><h1>Império Barbearia · Serviços</h1><a class="back" href="admin.html">← Voltar ao painel</a></header>
<main>
<section class="panel">
<h2 id="formTitle">Cadastrar serviço</h2>
<form id="serviceForm">
<input type="hidden" id="serviceId">
<div class="row">
<div><label for="name">Nome do serviço *</label><input id="name" required maxlength="100" placeholder="Ex.: Corte tradicional"></div>
<div><label for="price">Preço (R$) *</label><input id="price" required type="number" min="0" step="0.01" placeholder="0,00"></div>
<div><label for="duration">Duração (minutos) *</label><input id="duration" required type="number" min="5" step="5" value="30"></div>
</div>
<label for="description">Descrição</label><textarea id="description" maxlength="500" placeholder="Descreva o serviço"></textarea>
<label for="photo">Foto do serviço (URL da imagem)</label><input id="photo" type="url" placeholder="https://...">
<div class="row">
<div><label>Disponibilidade</label><div class="checks">
<label class="check"><input id="walkins" type="checkbox" checked> Clientes avulsos</label>
<label class="check"><input id="subscribers" type="checkbox" checked> Assinantes</label>
<label class="check"><input id="active" type="checkbox" checked> Serviço ativo</label>
</div></div>
<div><label>Profissionais que realizam</label><div id="professionalOptions" class="checks"><span class="muted">Carregando profissionais...</span></div></div>
</div>
<div class="actions"><button class="primary" id="saveBtn" type="submit">Salvar serviço</button><button class="secondary hidden" id="cancelBtn" type="button">Cancelar edição</button></div>
</form>
</section>
<section class="panel"><h2>Serviços cadastrados</h2><div id="status">Verificando acesso...</div><div id="serviceList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://xvvedeikerapozbajaii.supabase.co','sb_publishable_Nd8pXcRHo35OqTCzWZQvAg_mMehIU-s');
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let professionals=[],services=[],links=[];
function status(message){el('status').textContent=message;}
async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.href='login.html';return;}
 const {data:profile,error:profileError}=await db.from('profiles').select('role').eq('id',session.user.id).single();
 if(profileError||profile?.role!=='admin'){location.href='login.html';return;}
 await Promise.all([loadProfessionals(),loadServices()]);
}
async function loadProfessionals(){
 const {data,error}=await db.from('professionals').select('id,name,active').eq('active',true).order('name');
 if(error){el('professionalOptions').innerHTML='<span class="muted">Não foi possível carregar a equipe: '+esc(error.message)+'</span>';return;}
 professionals=data||[];
 el('professionalOptions').innerHTML=professionals.length?professionals.map(p=>'<label class="check"><input type="checkbox" name="professional" value="'+esc(p.id)+'"> '+esc(p.name)+'</label>').join(''):'<span class="muted">Nenhum profissional ativo cadastrado.</span>';
}
async function loadServices(){
 status('Carregando serviços...');
 const [serviceResult,linkResult]=await Promise.all([
  db.from('services').select('id,name,description,price,duration_minutes,photo_url,available_to_subscribers,available_to_walkins,active,created_at').order('name'),
  db.from('professional_services').select('service_id,professional_id')
 ]);
 if(serviceResult.error){status('Não foi possível carregar os serviços: '+serviceResult.error.message);return;}
 if(linkResult.error){status('Serviços carregados, mas não foi possível consultar os profissionais associados: '+linkResult.error.message);return;}
 services=serviceResult.data||[];links=linkResult.data||[];
 status(services.length+' serviço(s) encontrado(s).');
 renderServices();
}
function renderServices(){
 const target=el('serviceList');
 if(!services.length){target.innerHTML='<div class="empty">Nenhum serviço cadastrado. Use o formulário acima para adicionar o primeiro.</div>';return;}
 target.innerHTML=services.map(s=>{
  const names=links.filter(x=>x.service_id===s.id).map(x=>professionals.find(p=>p.id===x.professional_id)?.name).filter(Boolean);
  const tags=[s.active?'Ativo':'Inativo',s.available_to_walkins?'Avulsos':'Sem avulsos',s.available_to_subscribers?'Assinantes':'Sem assinantes'];
  return '<article class="service">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="Foto de '+esc(s.name)+'">':'')+
   '<div class="serviceInfo"><strong>'+esc(s.name)+'</strong><div class="muted">R$ '+Number(s.price||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+' · '+esc(s.duration_minutes)+' min</div>'+
   (s.description?'<p class="muted">'+esc(s.description)+'</p>':'')+
   '<div>'+tags.map(t=>'<span class="pill">'+t+'</span>').join('')+'</div><div class="muted">Profissionais: '+(names.length?names.map(esc).join(', '):'Nenhum associado')+'</div>'+
   '<div class="actions"><button class="secondary" type="button" data-edit="'+esc(s.id)+'">Editar</button></div></div></article>';
 }).join('');
 target.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>editService(btn.dataset.edit)));
}
function resetForm(){
 el('serviceForm').reset();el('serviceId').value='';el('duration').value=30;el('walkins').checked=true;el('subscribers').checked=true;el('active').checked=true;
 el('formTitle').textContent='Cadastrar serviço';el('saveBtn').textContent='Salvar serviço';el('cancelBtn').classList.add('hidden');
 document.querySelectorAll('input[name="professional"]').forEach(c=>c.checked=false);
}
function editService(id){
 const s=services.find(x=>x.id===id);if(!s)return;
 el('serviceId').value=s.id;el('name').value=s.name||'';el('price').value=s.price??0;el('duration').value=s.duration_minutes??30;
 el('description').value=s.description||'';el('photo').value=s.photo_url||'';
 el('walkins').checked=!!s.available_to_walkins;el('subscribers').checked=!!s.available_to_subscribers;el('active').checked=!!s.active;
 const selected=links.filter(x=>x.service_id===id).map(x=>x.professional_id);
 document.querySelectorAll('input[name="professional"]').forEach(c=>c.checked=selected.includes(c.value));
 el('formTitle').textContent='Editar serviço';el('saveBtn').textContent='Salvar alterações';el('cancelBtn').classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
}
el('cancelBtn').addEventListener('click',resetForm);
el('serviceForm').addEventListener('submit',async event=>{
 event.preventDefault();el('saveBtn').disabled=true;el('saveBtn').textContent='Salvando...';
 const id=el('serviceId').value;
 const payload={name:el('name').value.trim(),price:Number(el('price').value),duration_minutes:Number(el('duration').value),
  description:el('description').value.trim()||null,photo_url:el('photo').value.trim()||null,
  available_to_walkins:el('walkins').checked,available_to_subscribers:el('subscribers').checked,active:el('active').checked};
 try{
  let serviceId=id;
  if(id){
   const {error}=await db.from('services').update(payload).eq('id',id);if(error)throw error;
  }else{
   const {data,error}=await db.from('services').insert(payload).select('id').single();if(error)throw error;serviceId=data.id;
  }
  const selected=Array.from(document.querySelectorAll('input[name="professional"]:checked')).map(c=>c.value);
  const {error:deleteError}=await db.from('professional_services').delete().eq('service_id',serviceId);if(deleteError)throw deleteError;
  if(selected.length){const {error:insertError}=await db.from('professional_services').insert(selected.map(professional_id=>({service_id:serviceId,professional_id})));if(insertError)throw insertError;}
  resetForm();status('Serviço salvo com sucesso.');await loadServices();
 }catch(error){status('Não foi possível salvar: '+(error.message||'erro inesperado'));}
 finally{el('saveBtn').disabled=false;el('saveBtn').textContent=el('serviceId').value?'Salvar alterações':'Salvar serviço';}
});
init();
</script></body></html>
