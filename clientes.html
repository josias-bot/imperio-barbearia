<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e0c"><title>Clientes — Império Barbearia</title><link rel="stylesheet" href="painel.css">
<style>
main{max-width:1000px;padding-bottom:40px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.searchWrap{flex:1;min-width:220px}.searchWrap input{width:100%;padding:13px 15px;margin:0}.card{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:1px solid var(--app-line);border-radius:14px;background:var(--app-surface);margin:10px 0}.card strong{display:block;color:var(--app-text);margin-bottom:6px}.card small{color:var(--app-muted);line-height:1.6}.editBtn{white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--app-muted);border:1px dashed var(--app-line);border-radius:14px}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{width:min(100%,440px);background:#111811;border:1px solid var(--app-line);border-radius:18px;padding:20px}.dialog label{display:block;font-size:13px;margin:14px 0 6px}.dialog input{width:100%;padding:12px;border:1px solid var(--app-line);border-radius:10px;background:#090e0a;color:white}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.secondary{background:#263126!important;color:#eef5e9!important}@media(max-width:520px){.card{align-items:flex-start;flex-direction:column}.editBtn{width:100%}}
</style></head><body>
<header><div class="app-header-main"><div class="app-brand"><div class="app-brand-mark">I</div><div><h1>Império Barbearia</h1><small>Gestão de clientes</small></div></div><a class="back" href="admin.html">← Painel</a></div><nav class="app-nav" aria-label="Navegação principal"><a href="admin.html">Visão geral</a><a href="agendamentos.html">Agenda</a><a href="clientes.html">Clientes</a><a href="profissionais.html">Profissionais</a><a href="servicos.html">Serviços</a><a href="planos.html">Planos</a><a href="produtos.html">Produtos</a><a href="financeiro.html">Financeiro</a></nav></header>
<main><h2>Clientes</h2><p>Pesquise pelo nome ou telefone e corrija os dados cadastrais quando necessário.</p>
<div class="toolbar"><div class="searchWrap"><input id="search" type="search" placeholder="Pesquisar cliente por nome ou telefone..." autocomplete="off"></div><button id="refresh" class="secondary" type="button">Atualizar lista</button></div>
<div id="status">Verificando acesso...</div><div id="list"></div></main>
<div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="dialog" id="editForm"><h2 id="modalTitle">Editar cliente</h2><p id="editHint">Altere o nome ou telefone do cadastro.</p><label for="editName">Nome completo</label><input id="editName" maxlength="120" required><label for="editPhone">Telefone</label><input id="editPhone" type="tel" maxlength="30" placeholder="(00) 00000-0000"><div class="actions"><button type="button" class="secondary" id="cancelEdit">Cancelar</button><button type="submit" id="saveEdit">Salvar alterações</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://xvvedeikerapozbajaii.supabase.co','sb_publishable_Nd8pXcRHo35OqTCzWZQvAg_mMehIU-s');
const $=id=>document.getElementById(id);let rows=[],editing=null;
function say(v){$('status').textContent=v}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data:p,error:pe}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(pe||p?.role!=='admin'){location.href='login.html';return}await load()}
async function load(){say('Carregando clientes...');const {data,error}=await db.from('profiles').select('id,full_name,phone,created_at').eq('role','customer').order('created_at',{ascending:false}).limit(1000);if(error){say('Erro ao carregar clientes: '+error.message);return}rows=data||[];render()}
function render(){const term=$('search').value.trim().toLocaleLowerCase('pt-BR');const filtered=rows.filter(c=>(c.full_name||'').toLocaleLowerCase('pt-BR').includes(term)||(c.phone||'').toLocaleLowerCase('pt-BR').includes(term));$('list').replaceChildren();say(filtered.length+' de '+rows.length+' cliente(s).');if(!filtered.length){$('list').innerHTML='<div class="empty">Nenhum cliente encontrado.</div>';return}filtered.forEach(c=>{const card=document.createElement('article');card.className='card';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=c.full_name||'Nome não informado';const details=document.createElement('small');details.textContent='Telefone: '+(c.phone||'Não informado')+' · Cadastro: '+(c.created_at?new Date(c.created_at).toLocaleDateString('pt-BR'):'Não informado');info.append(name,details);const btn=document.createElement('button');btn.type='button';btn.className='editBtn';btn.textContent='Editar perfil';btn.addEventListener('click',()=>openEdit(c));card.append(info,btn);$('list').append(card)})}
function openEdit(c){editing=c;$('editName').value=c.full_name||'';$('editPhone').value=c.phone||'';$('editModal').classList.add('open');$('editName').focus()}
function closeEdit(){$('editModal').classList.remove('open');editing=null}
$('search').addEventListener('input',render);$('refresh').onclick=load;$('cancelEdit').onclick=closeEdit;
$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});
$('editForm').addEventListener('submit',async e=>{e.preventDefault();if(!editing)return;const full_name=$('editName').value.trim(),phone=$('editPhone').value.trim();if(!full_name){$('editName').focus();return}const btn=$('saveEdit');btn.disabled=true;btn.textContent='Salvando...';const {error}=await db.from('profiles').update({full_name,phone:phone||null}).eq('id',editing.id).eq('role','customer');btn.disabled=false;btn.textContent='Salvar alterações';if(error){say('Não foi possível salvar: '+error.message+'. Confira a política de edição no Supabase.');return}rows=rows.map(c=>c.id===editing.id?{...c,full_name,phone:phone||null}:c);closeEdit();render();say('Perfil do cliente atualizado com sucesso.')});
init();
</script><script id="app-nav-active">document.querySelectorAll('.app-nav a').forEach(a=>{const target=new URL(a.href,location.href).pathname.split('/').pop();if(target===location.pathname.split('/').pop())a.setAttribute('aria-current','page')});</script></body></html>
