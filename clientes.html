<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes — Império Barbearia</title><style>*{box-sizing:border-box}body{margin:0;background:#080a08;color:#f4f7f2;font-family:Arial,sans-serif}header{padding:20px;background:#111611;border-bottom:1px solid #293629;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2{color:#b7f34a}h1{font-size:22px;margin:0}main{max-width:900px;margin:auto;padding:22px}.back,button{display:inline-block;padding:12px 15px;border-radius:10px;background:#b7f34a;color:#101510;text-decoration:none;font-weight:bold;border:0;cursor:pointer}input{width:100%;padding:13px;border:1px solid #465640;border-radius:10px;background:#111611;color:white;font-size:16px;margin:12px 0}#status{color:#b8c2b3;margin:8px 0}.card{padding:14px;border:1px solid #34452f;border-radius:10px;background:#141b13;margin:10px 0}.card strong{display:block;color:#b7f34a;margin-bottom:6px}.card small{color:#b8c2b3;line-height:1.6}</style><link rel="stylesheet" href="painel.css"></head><body><header><h1>Império Barbearia · Clientes</h1><a class="back" href="admin.html">← Voltar ao painel</a><nav class="app-nav" aria-label="Navegação principal"><a href="admin.html">Visão geral</a><a href="agendamentos.html">Agenda</a><a href="clientes.html">Clientes</a><a href="profissionais.html">Profissionais</a><a href="servicos.html">Serviços</a><a href="planos.html">Planos</a><a href="produtos.html">Produtos</a><a href="financeiro.html">Financeiro</a></nav></header><main><h2>Cadastro de clientes</h2><p>Consulte os clientes cadastrados na barbearia.</p><input id="search" type="search" placeholder="Buscar por nome ou telefone..." autocomplete="off"><div id="status">Verificando acesso...</div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://xvvedeikerapozbajaii.supabase.co','sb_publishable_Nd8pXcRHo35OqTCzWZQvAg_mMehIU-s');let rows=[];const status=document.getElementById('status'),list=document.getElementById('list');async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return;}const {data:p,error:pe}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(pe||p.role!=='admin'){location.href='login.html';return;}const {data,error}=await db.from('profiles').select('id,full_name,phone,created_at').eq('role','customer').order('created_at',{ascending:false}).limit(100);if(error){status.textContent='Erro ao carregar clientes: '+error.message;return;}rows=data||[];render();}function render(){const term=document.getElementById('search').value.trim().toLocaleLowerCase('pt-BR');const filtered=rows.filter(c=>(c.full_name||'').toLocaleLowerCase('pt-BR').includes(term)||(c.phone||'').toLowerCase().includes(term));list.replaceChildren();status.textContent=filtered.length+' cliente(s) encontrado(s).';filtered.forEach(c=>{const card=document.createElement('div');card.className='card';const name=document.createElement('strong');name.textContent=c.full_name||'Nome não informado';const info=document.createElement('small');info.textContent='Telefone: '+(c.phone||'Não informado')+' · Cadastro: '+(c.created_at?new Date(c.created_at).toLocaleDateString('pt-BR'):'Não informado');card.append(name,info);list.append(card);});}document.getElementById('search').addEventListener('input',render);init();</script><script id="app-nav-active">document.querySelectorAll('.app-nav a').forEach(a=>{const target=new URL(a.href,location.href).pathname.split('/').pop();if(target===location.pathname.split('/').pop())a.setAttribute('aria-current','page')});</script></body></html>
